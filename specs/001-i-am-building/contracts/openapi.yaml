openapi: 3.1.0
info:
  title: Movie Review Website (Mock API)
  version: 1.0.0
  description: Read-only contract for mocked movie data used by the frontend.
paths:
  /movies:
    get:
      summary: List movies (mocked)
      responses:
        "200":
          description: A list of movies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Movie"
  /movies/{movieId}:
    get:
      summary: Get movie details by id (mocked)
      parameters:
        - in: path
          name: movieId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Movie details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Movie"
        "404":
          description: Movie not found
components:
  schemas:
    Movie:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        releaseYear:
          type: integer
        posterUrl:
          type: string
          nullable: true
        synopsis:
          type: string
          nullable: true
        cast:
          type: array
          items:
            type: string
        reviews:
          type: array
          items:
            $ref: "#/components/schemas/Review"
      required:
        - id
        - title
        - releaseYear
    Review:
      type: object
      properties:
        id:
          type: string
        author:
          type: string
        rating:
          type: integer
          minimum: 1
          maximum: 5
        text:
          type: string
          nullable: true
      required:
        - id
        - author
        - rating
